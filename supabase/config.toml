# Supabase project config — `supabase link --project-ref <ref>` then `supabase functions deploy`.
# Only the settings the app depends on are pinned here; everything else uses the CLI defaults.
project_id = "veyra"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# P2-08: Apple / Google sign-in + cloud sync (docs/SYNC.md). Providers, redirect URLs and the
# `sync_rows` table are set up on the hosted project; the Edge Functions below still accept the
# anon key so Quick Capture / Veyra AI / Google Calendar work signed out.

[edge_runtime]
enabled = true
policy = "per_worker"

# Phase 1: no login yet, so the app calls with the anon key only.
# Flip to true in Phase 2 once Supabase Auth ships and the app sends a user JWT.
[functions.ai-capture]
verify_jwt = false

[functions.assistant]
verify_jwt = false

# Google's OAuth redirect lands on /gcal/callback with no Supabase JWT; the function checks the
# signed state / device key itself.
[functions.gcal]
verify_jwt = false
