# Supabase project config — `supabase link --project-ref <ref>` then `supabase functions deploy`.
# Only the settings the app depends on are pinned here; everything else uses the CLI defaults.
project_id = "veyra"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# Google sign-in (features/auth) shipped in Phase 2. Enable the Google provider in the dashboard
# too (Authentication → Providers) — this file only carries settings the CLI can push.

[edge_runtime]
enabled = true
policy = "per_worker"

# The app sends the signed-in user's JWT when there is one, the anon key otherwise (both verify
# fine here) — see src/features/ai/remote.ts, src/features/assistant/remote.ts.
[functions.ai-capture]
verify_jwt = true

[functions.assistant]
verify_jwt = true

# Google's OAuth redirect lands on /gcal/callback with no Supabase JWT; the function checks the
# signed state / device key itself.
[functions.gcal]
verify_jwt = false

# Gmail (P4-01): like gcal, Google's redirect lands on /gmail/callback with no Supabase JWT.
[functions.gmail]
verify_jwt = false
